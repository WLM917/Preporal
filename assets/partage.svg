<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PrepOral — Réussis ton oral du premier coup">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A12"/>
      <stop offset="100%" stop-color="#15121F"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#A78BFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fond)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Marque -->
  <g transform="translate(96,84)">
    <rect width="56" height="56" rx="16" fill="url(#marque)"/>
    <g fill="#fff" transform="translate(16,17)">
      <rect x="0"  y="6"  width="4" height="10" rx="2"/>
      <rect x="7"  y="2"  width="4" height="18" rx="2"/>
      <rect x="14" y="0"  width="4" height="22" rx="2"/>
      <rect x="21" y="4"  width="4" height="14" rx="2"/>
    </g>
    <text x="74" y="38" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#F4F2FA">
      Prep<tspan fill="#A78BFF">Oral</tspan>
    </text>
  </g>

  <!-- Titre, avec le surligneur au marqueur -->
  <text x="96" y="290" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" fill="#F4F2FA" letter-spacing="-2.5">
    Réussis ton oral
  </text>
  <g transform="rotate(-1.1 96 372)">
    <rect x="82" y="320" width="722" height="80" rx="14" fill="#F5A524" opacity=".94"/>
  </g>
  <text x="96" y="382" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" fill="#1A1204" letter-spacing="-2.5">
    du premier coup.
  </text>

  <text x="96" y="452" font-family="Inter, system-ui, sans-serif" font-size="27" fill="#9C96B4">
    Entretien · Grand Oral · brevet · concours · pitch · certification de langue
  </text>

  <!-- Bandeau de faits vérifiables -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="96"  y="540" font-size="40" font-weight="800" fill="#F4F2FA">7</text>
    <text x="134" y="540" font-size="21" fill="#9C96B4">types d'oraux</text>
    <text x="360" y="540" font-size="40" font-weight="800" fill="#F4F2FA">2</text>
    <text x="392" y="540" font-size="21" fill="#9C96B4">simulations offertes</text>
    <text x="700" y="540" font-size="40" font-weight="800" fill="#F4F2FA">4</text>
    <text x="732" y="540" font-size="21" fill="#9C96B4">axes notés</text>
  </g>
  <rect x="96" y="566" width="1008" height="1" fill="#262336"/>
</svg>
